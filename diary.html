<!-- ✅ diary.html (완성형) -->
<section id="diary" style="padding:3em; max-width:700px; margin:auto;">
  <h2 style="font-size:2em; margin-bottom:1.5em;">📓 일기</h2>

  <div style="text-align:center; margin-bottom:2em;">
    <button onclick="filterDiary('all', this)" class="filter-btn active">전체</button>
    <button onclick="filterDiary('민우석', this)" class="filter-btn">민우석</button>
    <button onclick="filterDiary('방지축', this)" class="filter-btn">방지축</button>
    <button onclick="toggleOrder()" id="orderBtn" class="filter-btn" style="margin-left:1em;">최신순</button>
  </div>

  <div id="diaryList"></div>
</section>

<script>
/* -------------------------------
   📘 일기 데이터
-------------------------------- */
const diaryEntries = [
  { 
    date: "2024.02.11", 
    author: "민우석", 
    text: `나는 불안의 가장자리를 핥는다.
그곳에서 진실이 피를 흘리고 있다.
그리고 나는, 그 피로 내 이름을 쓴다.` 
  },
  { 
    date: "2024.02.13", 
    author: "방지축", 
    text: `너는 나를 눈치챘다.
그러나 너는 애써 외면했다.
그러나 곧, 너는 눈을 뜨게 될 지어니.` 
  },
];

let currentFilter = "all";
let sortNewestFirst = true;

/* -------------------------------
   ✍️ 스타일 프리셋
-------------------------------- */
const styleHuman = `
  font-family: 'Noto Serif KR', serif;
  color: rgba(0,0,0,0.75);
  font-weight: 300;
  letter-spacing: 0.2px;
  line-height: 1.8;
  font-style: italic;
  margin-top: 0.6em;
`;

const styleVan = `
  font-family: 'JetBrains Mono', monospace;
  color: #fefefe;
  background: linear-gradient(180deg, #111, #1a1a1a);
  padding: 1.4em;
  border-radius: 10px;
  font-weight: 600;
  letter-spacing: 0.5px;
  line-height: 1.8;
  box-shadow: 0 0 8px rgba(255,255,255,0.1);
  margin-top: 0.6em;
`;

/* -------------------------------
   📄 일기 렌더링 함수
-------------------------------- */
function renderDiary() {
  const list = document.getElementById("diaryList");
  if (!list) return;
  list.innerHTML = "";

  // 필터 적용
  let filtered = diaryEntries.filter(e => currentFilter === "all" || e.author === currentFilter);

  // 날짜 정렬 (브라우저 간 호환)
  filtered.sort((a, b) => {
    const [ya, ma, da] = a.date.split('.').map(x => x.trim());
    const [yb, mb, db] = b.date.split('.').map(x => x.trim());
    const A = new Date(`${ya}-${ma}-${da}T00:00:00`);
    const B = new Date(`${yb}-${mb}-${db}T00:00:00`);
    return sortNewestFirst ? B - A : A - B;
  });

  // 일기 박스 생성
  filtered.forEach((entry, i) => {
    const box = document.createElement("div");
    box.classList.add("fade-in");
    box.style.animationDelay = `${i * 0.1}s`;
    box.style.marginBottom = "3em";

    const header = document.createElement("p");
    header.textContent = `${entry.date} · ${entry.author}`;
    header.style.color = entry.author === "방지축" ? "#ff5252" : "#888";
    header.style.fontSize = "0.95em";
    header.style.marginBottom = "0.4em";

    const body = document.createElement("p");
    body.innerText = entry.text;
    body.setAttribute("style", entry.author === "방지축" ? styleVan : styleHuman);

    box.appendChild(header);
    box.appendChild(body);
    list.appendChild(box);
  });
}

/* -------------------------------
   🎛️ 필터 / 정렬 제어
-------------------------------- */
function filterDiary(type, btn) {
  currentFilter = type;
  document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  renderDiary();
}

function toggleOrder() {
  sortNewestFirst = !sortNewestFirst;
  document.getElementById("orderBtn").textContent = sortNewestFirst ? "최신순" : "오래된순";
  renderDiary();
}

/* -------------------------------
   🔄 섹션 전환 (index.html 연동용)
-------------------------------- */
function showSection(id, event) {
  document.querySelectorAll("section").forEach(s => s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  document.querySelectorAll("nav button").forEach(b => b.classList.remove("active"));
  event.target.classList.add("active");
  if (id === "diary") renderDiary();
}

/* -------------------------------
   🚀 초기 렌더링 (페이지 로드 시)
-------------------------------- */
window.addEventListener("load", renderDiary);
</script>
